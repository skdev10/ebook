# Nginx reverse proxy for EBookDashboard.
# Public :5000 (and optional :80) → Kestrel on 127.0.0.1:5050.
# Chapter/cover AI calls can take many minutes; default nginx 60s causes 504 Gateway Time-out.
#
# Install on server:
#   cd /opt/EbookAI && sudo bash deploy/apply-nginx-timeouts.sh

upstream ebook_dashboard {
    server 127.0.0.1:5050;
    keepalive 32;
}

server {
    listen 80;
    server_name 138.197.76.70 _;

    client_max_body_size 100M;

    location / {
        proxy_pass http://ebook_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 5000;
    server_name 138.197.76.70 _;

    client_max_body_size 100M;

    location / {
        proxy_pass http://ebook_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
