# Nginx reverse proxy for EBookDashboard (optional — use if you access via domain/HTTPS).
# AI routes (generate chapter, edit, cover) can take many minutes; default nginx 60s causes 504.
#
# Install:
#   sudo cp deploy/nginx-ebookai.conf /etc/nginx/sites-available/ebookai
#   sudo ln -sf /etc/nginx/sites-available/ebookai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream ebook_dashboard {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    client_max_body_size 100M;

    # Long-running AI proxy routes
    location ~ ^/(Books/AIGenerateBook|Books/AIEditBook|Books/GenerateAICoverPreview|Books/EditAICoverPreview|Dashboard/GenerateCover|Dashboard/EditCover|Dashboard/RegenerateCover|Dashboard/GeneratePrintReadyCover) {
        proxy_pass http://ebook_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://ebook_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
