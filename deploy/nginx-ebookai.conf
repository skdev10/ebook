# Nginx reverse proxy for EBookDashboard (optional — port 80 → app on :5000).
# Chapter/cover AI calls can take many minutes; default nginx 60s causes 504 Gateway Time-out.
#
# If users access http://IP:5000 directly (no nginx on 5000), also run deploy on the server:
#   sudo bash deploy/apply-nginx-timeouts.sh
# which patches proxy_read_timeout on any existing nginx site (including one on :5000).
#
# Install:
#   sudo bash deploy/apply-nginx-timeouts.sh

upstream ebook_dashboard {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name 138.197.76.70 _;

    client_max_body_size 100M;

    location / {
        proxy_pass http://ebook_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
